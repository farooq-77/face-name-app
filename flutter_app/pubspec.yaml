name: face_name_app
description: Private per-user facial recognition and tagging app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.13.0
  firebase_auth: 6.5.6
  cloud_firestore: 6.8.0
  google_sign_in: 7.2.0
  image_picker: 1.2.3
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
