services:
  - type: web
    name: face-name-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: FACE_MATCH_TOLERANCE
        value: "0.50"
      - key: MAX_FACES_PER_USER
        value: "1000"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
